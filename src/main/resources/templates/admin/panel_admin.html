<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: molde(
          'Panel de Control',
          'Resumen operativo general de la librería',
          'panel_admin.css',
          'panel_admin.js',
          'panel',
          ~{:: .dashboard-container}
      )}">
<head>
    <title>Panel de Control</title>
</head>
<body>

    <div class="dashboard-container" data-css="panel_admin.css">

        <div class="pn-kpis">
            <div class="pn-kpi" th:each="k : ${p.kpis()}">
                <div class="pn-kpi-cab">
                    <span class="pn-icono" th:classappend="'t-' + ${k.tono()}"><i class="fa-solid" th:classappend="${k.icono()}"></i></span>
                    <span class="pn-kpi-titulo" th:text="${k.titulo()}">ARTÍCULOS</span>
                </div>
                <strong class="pn-kpi-valor" th:text="${k.valor()}">0</strong>
                <span class="pn-kpi-detalle" th:text="${k.detalle()}">detalle</span>
            </div>
        </div>

        <!-- Últimos 7 días -->
        <section class="pn-card pn-c-grafico">
            <header class="pn-cab">
                <h3>Últimos 7 días</h3>
                <div class="pn-leyenda">
                    <span><i class="pn-punto pn-prestamos"></i>Préstamos <b th:text="${p.totalPrestamos7()}">0</b></span>
                    <span><i class="pn-punto pn-devoluciones"></i>Devoluciones <b th:text="${p.totalDevoluciones7()}">0</b></span>
                </div>
            </header>
            <div class="pn-grafico">
                <div class="pn-dia" th:each="d : ${p.dias()}">
                    <div class="pn-barras">
                        <div class="pn-relleno pn-prestamos" th:style="'height:' + ${d.altoPrestamos()} + '%'">
                            <span class="pn-valor" th:text="${d.prestamos()}">0</span>
                        </div>
                        <div class="pn-relleno pn-devoluciones" th:style="'height:' + ${d.altoDevoluciones()} + '%'">
                            <span class="pn-valor" th:text="${d.devoluciones()}">0</span>
                        </div>
                    </div>
                    <span class="pn-etiqueta" th:text="${d.etiqueta()}">Hoy</span>
                </div>
            </div>
        </section>

        <!-- Requiere tu atención -->
        <section class="pn-card pn-c-atencion">
            <header class="pn-cab"><h3>Requiere tu atención</h3></header>
            <div class="pn-avisos">
                <a class="pn-aviso" th:each="a : ${p.atencion()}" th:href="@{${a.url()}}" th:classappend="${a.pendiente()} ? 'pendiente'">
                    <span class="pn-icono" th:classappend="${a.pendiente()} ? 't-' + ${a.tono()}"><i class="fa-solid" th:classappend="${a.icono()}"></i></span>
                    <strong class="pn-cantidad" th:text="${a.cantidad()}">0</strong>
                    <span class="pn-aviso-texto" th:text="${a.texto()}">Pedidos por entregar</span>
                    <small th:text="${a.pendiente() ? a.detalle() : 'Al día'}">detalle</small>
                </a>
            </div>
        </section>

        <!-- Historial de actividad -->
        <section class="pn-card pn-c-actividad">
            <header class="pn-cab">
                <h3>Actividad reciente</h3>
                <small class="pn-total"><span id="pnConteo" th:text="${p.totalActividad()}">0</span> movimientos</small>
            </header>
            <div class="pn-filtros">
                <button type="button" class="pn-filtro activo" data-filtro="todo">Todo</button>
                <button type="button" class="pn-filtro" data-filtro="prestamo">Préstamos</button>
                <button type="button" class="pn-filtro" data-filtro="pedido">Pedidos</button>
                <button type="button" class="pn-filtro" data-filtro="devolucion">Devoluciones</button>
                <button type="button" class="pn-filtro" data-filtro="multa">Multas</button>
            </div>
            <p class="pn-vacio" th:if="${p.totalActividad() == 0}">Todavía no hay movimientos.</p>
            <div class="pn-historial" id="pnHistorial" th:if="${p.totalActividad() > 0}">
                <div class="pn-grupo" th:each="g : ${p.actividad()}">
                    <div class="pn-dia-titulo" th:text="${g.etiqueta()}">Hoy</div>
                    <div class="pn-mov" th:each="a : ${g.movimientos()}" th:attr="data-filtro=${a.filtro()}">
                        <span class="pn-icono" th:classappend="'t-' + ${a.tono()}"><i class="fa-solid" th:classappend="${a.icono()}"></i></span>
                        <span class="pn-mov-texto">
                            <span class="pn-mov-linea"><b th:text="${a.quien()}">Lector</b><small th:text="${a.hora()}">09:41</small></span>
                            <span class="pn-mov-detalle"><em th:text="${a.tipo()}">Préstamo</em><span th:text="${a.detalle()}">detalle</span></span>
                        </span>
                    </div>
                </div>
                <p class="pn-vacio" id="pnSinResultados" hidden>No hay movimientos de este tipo.</p>
            </div>
        </section>

    </div>
</body>
</html>
