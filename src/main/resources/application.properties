# Nombre de la aplicación
spring.application.name=sistema

# CONEXIÓN A BASE DE DATOS MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/libred_v22?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desactivar caché de vistas y archivos estáticos para desarrollo
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# SOPORTE POR CORREO (Ayuda y Soporte del administrador)
# Las solicitudes llegan a este correo con el asunto "[LibRed #0001] ..." y se responden desde el mismo correo.
libred.soporte.correo=emersonlavictoria@gmail.com
# Contraseña de aplicación de Google (16 letras, sin espacios). Es un dato secreto: no subas este archivo a GitHub.
# Si queda vacía, el módulo funciona igual pero no envía ni lee correos.
libred.soporte.clave=zycbablvxuertgxh
libred.soporte.imap-host=imap.gmail.com

# Canal de WhatsApp del administrador. whatsapp: número con código de país y sin signos (ej. 51987654321); vacío = canal apagado.
libred.soporte.whatsapp=51979693214

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${libred.soporte.correo}
spring.mail.password=${libred.soporte.clave}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Pagos de prueba: tipo de cambio S/ por US$ (PayPal cobra en dólares)
libred.pago.tipo-cambio-usd=3.75

# SMS a lectores (bienvenida y recuperar acceso). 'simulado' = no sale ningún mensaje real: se muestra en pantalla
# como una notificación de celular y se anota en la consola. Con un proveedor real se cambiaría este valor.
libred.sms.modo=simulado

# Monitoreo y Salud (Spring Boot Actuator)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Configuración de Logs en archivo rotativo
logging.file.name=logs/libred-sistema.log
logging.level.root=INFO
logging.level.com.libred.sistema=DEBUG
