# Nombre de la aplicación
spring.application.name=sistema

# ===============================
# CONEXIÓN A BASE DE DATOS MYSQL
# ===============================
# Cambia 'libred_db' si tu base de datos se llama distinto en Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/libred_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# OJO: Pon aquí la contraseña que usas para entrar a tu MySQL Workbench
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' es la magia que creará las tablas automáticamente en base a tus clases
spring.jpa.hibernate.ddl-auto=update
# 'true' nos permite ver en la consola los comandos SQL que hace Spring por debajo
spring.jpa.show-sql=true

# Desactivar caché de vistas y archivos estáticos para desarrollo
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0