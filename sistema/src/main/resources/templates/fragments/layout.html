
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="baseLayout(content, pageName)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema LibRed - Portal del Lector</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <div class="app-layout d-flex">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar-container bg-white border-end shadow-sm">
            <div th:replace="~{fragments/sidebar-lector :: sidebar(${pageName})}">
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <div th:replace="${content}"></div>
        </main>

    </div>

    <!-- Bootstrap JS: necesario para el modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
